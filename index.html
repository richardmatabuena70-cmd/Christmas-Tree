<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merry Christmas</title>
  <link rel="stylesheet" href="greet.css">
</head>
<body>
 <audio id="myAudio">
      <source src="christmas.mp3" type="audio/mpeg" />
    </audio>

    <div class="music-control">
      <button onclick="document.getElementById('myAudio').play()">
        ▶ Play Music
      </button>
    </div>
  <!-- Snow (background only) -->
  <div class="snow"></div>

  <div class="container">
    <button id="openBtn">🎄 Open Christmas Letter 🎄</button>

    <div class="envelope" id="envelope">
      <div class="flap"></div>

      <div class="letter">
        <h1>🎅 Merry Christmas! 🎄</h1>
        <p>
Merry Christmas, family 🎄
I’m so thankful for each one of you.<br> Thank you for the love, care, and memories we share.<br> May this Christmas bring us happiness,<br> good health, and more moments together. ✨
        </p>
        <span>✨ Warmest Wishes ✨</span>
      </div>

      <div class="body"></div>
    </div>
  </div>

  <script src="greets.js"></script>
</body>
</html>
